<!DOCTYPE html>
<html>
<head>
    <title>Formulir Pendaftaran Perpustakaan Kota Madiun</title>
</head>
<body>
    <h2>Formulir Pendaftaran Anggota Perpustakaan Kota Madiun</h2>
    <form action="proses_perpus.php" method="post">
        <label>Nama Lengkap:</label><br />
        <input type="text" name="nama_lengkap" size="30" />
        <br /><br />

        <label>Nomor Identitas (NIK/NIS):</label><br />
        <input type="text" name="no_identitas" size="30" />
        <br /><br />

        <label>Jenis Kelamin:</label><br />
        <input type="radio" name="jenis_kelamin" value="Laki-laki" checked /> Laki-laki
        <input type="radio" name="jenis_kelamin" value="Perempuan" /> Perempuan
        <br /><br />

        <label>Status / Pekerjaan:</label><br />
        <select name="status">
            <option value="Pelajar" selected>Pelajar</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Umum">Umum</option>
        </select>
        <br /><br />

        <label>Alamat Lengkap:</label><br />
        <textarea name="alamat" rows="4" cols="30">Masukkan alamat Anda di sini</textarea>
        <br /><br />

        <input type="submit" value="Daftar" />
        <input type="reset" value="Reset" />
    </form>
</body>
</html>
