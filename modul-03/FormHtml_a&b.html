<!DOCTYPE html>
<html>
<head>
    <title>Belajar Membuat Form</title>
</head>
<body>
    <form action="formulir.html" method="get">
        <label>Nama :</label> 
        <input type="text" name="nama" value="Nama Kamu" />
        <br />

        <label>Password:</label> 
        <input type="password" name="password" />
        <br />

        <label>Jenis Kelamin :</label>
        <input type="radio" name="jenis_kelamin" value="laki-laki" checked /> Laki-Laki
        <input type="radio" name="jenis_kelamin" value="perempuan" /> Perempuan
        <br />

        <label>Hobi :</label>
        <input type="checkbox" name="hobi_baca" value="baca" /> Membaca Buku
        <input type="checkbox" name="hobi_menulis" value="menulis" checked /> Menulis
        <input type="checkbox" name="hobi_mancing" value="mancing" /> Memancing
        <br />

        <label>Asal Kota:</label>
        <select name="asal_kota">
            <option value="Jakarta">Jakarta</option>
            <option value="Bandung">Bandung</option>
            <option value="Semarang" selected>Semarang</option>
        </select>
        <br />

        <label>Komentar Anda:</label><br />
        <textarea name="komentar" rows="5" cols="20">Silahkan katakan isi hati anda</textarea>
        <br />

        <input type="submit" value="Mulai Proses!" />
    </form>
</body>
</html>
